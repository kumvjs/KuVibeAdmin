packages:
  - docs
  # Vben 维护独立 workspace/catalog/锁文件，不纳入根工作区。
  - packages/backend

# 保持本地与 CI 相同的依赖布局，避免 pnpm 11 在运行脚本前自动切换。
virtualStoreType: project

allowBuilds:
  '@hyperjump/json-pointer': true
  '@hyperjump/json-schema': true
  '@hyperjump/json-schema-core': true
  '@hyperjump/pact': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  argon2: true
  protobufjs: false
  puppeteer: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/eslintrc@3.3.7'
  - globals@17.12.0
  - typeorm@1.1.1
